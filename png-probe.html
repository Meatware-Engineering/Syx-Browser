<!doctype html><title>PNG pixel probe</title><script src="vendor/pngjs.js"></script><pre id="result">Running…</pre><script>
try {
  const bytes = Uint8Array.of(10,20,30,0,40,50,60,255);
  const encoded = png.PNG.sync.write({width:2,height:1,data:bytes});
  const BufferType = new png.PNG({width:1,height:1}).data.constructor;
  const decoded = png.PNG.sync.read(BufferType.from(new Int8Array(encoded.buffer,encoded.byteOffset,encoded.byteLength)));
  if ([...decoded.data].join(',') !== [...bytes].join(',')) throw new Error('Pixel mismatch');
  document.getElementById('result').textContent = 'PASS: transparent RGB survives PNG encoding and decoding';
} catch(e) { document.getElementById('result').textContent = 'FAIL: ' + e; }
</script>
