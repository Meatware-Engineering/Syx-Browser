<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Язык Songs of Syx</title>
<style>body{font:16px/1.5 system-ui,sans-serif;background:#191918;color:#eee;max-width:46rem;margin:3rem auto;padding:0 1rem}select{font:inherit;padding:.4rem;max-width:100%}a{color:#c9af79}</style>
<h1>Язык Songs of Syx</h1>
<p>Выбор действует в этом браузере. Сохраните партию и перезагрузите игру, чтобы применить язык.</p>
<label for="language">Язык интерфейса</label><br><select id="language"></select>
<p id="status" role="status" aria-live="polite"></p>
<p><a href="/">Открыть игру</a> · <a href="/saves.html">Сохранения</a></p>
<script src="language.js"></script>
<script>
const select = document.querySelector('#language'), status = document.querySelector('#status');
for (const [code, label] of languageOptions) select.add(new Option(label, code));
select.value = readBrowserLanguage();
select.addEventListener('change', () => {
  try { localStorage.setItem(languageKey, select.value); status.textContent = 'Язык сохранён. Перезагрузите игру.'; }
  catch { status.textContent = 'Не удалось сохранить выбор в браузере.'; }
});
</script>
</html>
